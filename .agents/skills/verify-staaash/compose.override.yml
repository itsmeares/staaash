services:
  staaash:
    container_name: ${STAAASH_VERIFY_PROJECT}_web
    image: ${STAAASH_VERIFY_IMAGE}
    ports: !override
      - "${STAAASH_VERIFY_TAILNET_IP}:${STAAASH_VERIFY_WEB_PORT}:2113"
      - "127.0.0.1:${STAAASH_VERIFY_WEB_PORT}:2113"
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      SECURE_COOKIES: "false"
    volumes: !override
      - staaash-verify-files:/data/files
    restart: "no"
    cpus: "${STAAASH_VERIFY_WEB_CPUS:-1.0}"
    mem_limit: ${STAAASH_VERIFY_WEB_MEMORY:-1g}

  worker:
    container_name: ${STAAASH_VERIFY_PROJECT}_worker
    image: ${STAAASH_VERIFY_IMAGE}
    volumes: !override
      - staaash-verify-files:/data/files
    restart: "no"
    cpus: "${STAAASH_VERIFY_WORKER_CPUS:-0.5}"
    mem_limit: ${STAAASH_VERIFY_WORKER_MEMORY:-512m}

  db:
    container_name: ${STAAASH_VERIFY_PROJECT}_db
    ports: !override
      - "127.0.0.1:${STAAASH_VERIFY_DB_PORT}:5432"
    volumes: !override
      - staaash-verify-db:/var/lib/postgresql
    restart: "no"
    cpus: "${STAAASH_VERIFY_DB_CPUS:-0.5}"
    mem_limit: ${STAAASH_VERIFY_DB_MEMORY:-512m}

volumes:
  staaash-verify-db:
  staaash-verify-files:
