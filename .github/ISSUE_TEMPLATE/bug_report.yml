name: Bug report
description: Report a defect with enough detail to reproduce it.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking a close look. Keep this concrete and do not include secrets, private files, tokens, or local runtime data.

  - type: input
    id: summary
    attributes:
      label: Short summary
      description: One line on what is broken.
      placeholder: Upload finishes, but the file never appears in the library
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: Describe what you are seeing now.
      placeholder: The request returns 200, but the file record is missing after refresh.
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: Describe the behavior you expected instead.
      placeholder: The uploaded file should appear in the current folder immediately after the request completes.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps needed to reproduce the problem.
      placeholder: |
        1. Start the web app and worker locally
        2. Sign in as a regular user
        3. Open a library folder
        4. Upload a file larger than 10 MB
        5. Refresh the page
        6. Observe the missing file entry
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: Choose the matching severity label based on the effect on users.
      options:
        - High - a major feature is blocked or unreliable
        - Medium - a workflow is degraded or an important behavior is incorrect
        - Low - a minor defect or rough edge
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Pick the closest area. Use extra context below if more than one applies.
      options:
        - web
        - worker
        - database / prisma
        - docs
        - ci / tooling
        - operations / storage
        - other
        - not sure
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Share the Staaash version and details that apply. For a server, include host OS, version, and CPU architecture. For the desktop app, include OS, version, and CPU architecture. For web issues, include browser and version. For Docker installs, include Docker and Compose versions.
      placeholder: |
        Staaash version:
        How it runs (Docker Compose, desktop app, local build):
        Relevant OS, version, and CPU architecture:
        Browser and version, if this is a web issue:
        Docker and Compose versions, if relevant:
      render: markdown
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Screenshots or log output
      description: Paste logs or describe any screenshots you are attaching. Drag files into the issue after the form opens if needed.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra_context
    attributes:
      label: Extra context
      description: Add any related links, prior investigation, or constraints.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      description: Confirm these before submitting.
      options:
        - label: I searched the existing issues first.
          required: true
        - label: I removed secrets, private data, and local runtime contents from this report.
          required: true
