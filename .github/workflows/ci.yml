name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Run upgrade and recovery validation
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select test suites
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.suites.outputs.app }}
      upgrade: ${{ steps.suites.outputs.upgrade }}
      recovery: ${{ steps.suites.outputs.recovery }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node --test scripts/ci/*.test.mjs
      - id: suites
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CI_FULL: ${{ inputs.extended && 'true' || 'false' }}
        run: node scripts/ci/select.mjs

  checks:
    name: Lint and fast tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:59999/staaash_test
      UPLOAD_LOCATION: ./.data/files
      AUTH_SECRET: test-only-ci-secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24.22.0
          cache: true
      - name: Generate Prisma client
        run: vp run db:generate
      - name: Check formatting
        run: vp run format:check
      - name: Lint
        run: vp run lint
      - name: Fallow new-code gate
        run: vp run quality:fallow
      - name: Fast tests
        env:
          STAAASH_COVERAGE: ${{ github.event_name != 'pull_request' }}
        run: vp run test
      - name: Save coverage
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: source-coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 7

  postgres:
    name: PostgreSQL integration (${{ matrix.arch }})
    needs: select
    if: needs.select.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-latest
          - arch: ARM64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: staaash_test
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U test -d staaash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24.22.0
          cache: true
      - name: Generate Prisma client
        run: vp run db:generate
      - name: Build shared packages
        run: vp run build:deps
      - name: PostgreSQL integration tests
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://test:test-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/staaash_test
        run: vp run test:postgres

  images:
    name: Docker integration and E2E (${{ matrix.arch }})
    needs: select
    if: needs.select.outputs.app == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: ARM64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    env:
      STAAASH_TEST_IMAGE: staaash-test:${{ github.sha }}
      STAAASH_TEST_RECOVERY: ${{ needs.select.outputs.recovery }}
      STAAASH_TEST_VISUAL: ${{ matrix.arch == 'AMD64' }}
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24.22.0
          cache: true
      - uses: docker/setup-buildx-action@v4
      - name: Build native image once
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.STAAASH_TEST_IMAGE }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
      - name: Generate Prisma client
        run: vp run db:generate
      - name: Install browser
        run: vp exec --filter web playwright install --with-deps --only-shell chromium
      - name: Run complete native suites
        run: node scripts/ci/stack.mjs
      - name: Resolve immutable stable release
        if: needs.select.outputs.upgrade == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/resolve-stable.mjs
      - name: Validate populated upgrade
        if: needs.select.outputs.upgrade == 'true'
        env:
          STAAASH_TEST_UPGRADE: "true"
        run: node scripts/ci/stack.mjs
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-evidence-${{ matrix.arch }}
          path: |
            .data/ci/
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  validate:
    name: Lint, test, and build
    needs: [select, checks, postgres, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks
        env:
          SELECT: ${{ needs.select.result }}
          CHECKS: ${{ needs.checks.result }}
          APP: ${{ needs.select.outputs.app }}
          POSTGRES: ${{ needs.postgres.result }}
          IMAGES: ${{ needs.images.result }}
        run: |
          test "$SELECT" = success
          test "$CHECKS" = success
          if test "$APP" = true; then
            test "$POSTGRES" = success
            test "$IMAGES" = success
          else
            test "$APP" = false
            test "$POSTGRES" = skipped
            test "$IMAGES" = skipped
          fi
