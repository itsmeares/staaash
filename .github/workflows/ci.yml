name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      extended:
        description: Run upgrade and recovery validation
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Desktop tests run in plain Node; only installers need Electron itself.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    name: Select test suites
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.suites.outputs.app }}
      upgrade: ${{ steps.suites.outputs.upgrade }}
      recovery: ${{ steps.suites.outputs.recovery }}
      desktop: ${{ steps.suites.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: >-
          node --test scripts/ci/select*.test.mjs
          scripts/ci/resolve-stable.test.mjs scripts/ci/cleanup.test.mjs
          scripts/ci/stack.test.mjs
      - id: suites
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
          CI_FULL: ${{ (inputs.extended || github.event.before == '0000000000000000000000000000000000000000') && 'true' || 'false' }}
        run: node scripts/ci/select.mjs

  checks:
    name: Lint and fast tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:59999/staaash_test
      UPLOAD_LOCATION: ./.data/files
      AUTH_SECRET: test-only-ci-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24.22.1
          cache: true
      - name: Check test-stack isolation
        run: node --test scripts/ci/isolation.test.mjs
      - name: Generate Prisma client
        run: vp run db:generate
      - name: Check formatting
        run: vp run format:check
      - name: Lint
        run: vp run lint
      - name: Fallow new-code gate
        run: vp run quality:fallow
      - name: API stays compatible within its major version
        run: |
          node --test scripts/ci/openapi-compat.test.mjs
          node scripts/ci/openapi-compat.mjs
      - name: Fast tests
        env:
          STAAASH_COVERAGE: ${{ github.event_name != 'pull_request' }}
        run: vp run test
      - name: Frontend preview request tests
        run: vp run --filter web test:ui
      - name: Install preview browser
        run: vp exec --filter web playwright install --with-deps --only-shell chromium
      - name: Frontend preview browser smoke tests
        run: vp run --filter web e2e:ui --grep @smoke
      - name: Save preview browser failures
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-preview-failures
          path: apps/web/test-results/ui/
          retention-days: 7
      - name: Save coverage
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 7

  postgres:
    name: PostgreSQL integration (${{ matrix.arch }})
    needs: select
    if: needs.select.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-latest
          - arch: ARM64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: staaash_test
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -U test -d staaash_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24.22.1
          cache: true
      - name: Generate Prisma client
        run: vp run db:generate
      - name: Build shared packages
        run: vp run build:deps
      - name: PostgreSQL integration tests
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql://test:test-only-password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/staaash_test
        run: vp run test:postgres

  native:
    name: Native tests (${{ matrix.arch }})
    needs: select
    if: needs.select.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: ARM64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
    uses: ./.github/workflows/ci-native.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      upgrade: ${{ needs.select.outputs.upgrade == 'true' }}
      recovery: ${{ needs.select.outputs.recovery == 'true' }}

  desktop:
    needs: select
    if: needs.select.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.sha }}

  validate:
    name: Lint, test, and build
    needs: [select, checks, postgres, native, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks
        env:
          SELECT: ${{ needs.select.result }}
          CHECKS: ${{ needs.checks.result }}
          APP: ${{ needs.select.outputs.app }}
          POSTGRES: ${{ needs.postgres.result }}
          NATIVE: ${{ needs.native.result }}
          DESKTOP: ${{ needs.desktop.result }}
          DESKTOP_SELECTED: ${{ needs.select.outputs.desktop }}
        run: |
          test "$SELECT" = success
          test "$CHECKS" = success
          if test "$APP" = true; then
            test "$POSTGRES" = success
            test "$NATIVE" = success
          else
            test "$APP" = false
            test "$POSTGRES" = skipped
            test "$NATIVE" = skipped
          fi
          if test "$DESKTOP_SELECTED" = true; then
            test "$DESKTOP" = success
          else
            test "$DESKTOP" = skipped
          fi
