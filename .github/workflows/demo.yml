name: Demo

# Publishes the browser-only demo to GitHub Pages. A release deploys its own
# tag; running it by hand redeploys the latest release, or the given ref.
on:
  workflow_call:
    inputs:
      ref:
        description: Release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to build; empty builds the latest release
        required: false
        type: string
        default: ""

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish the demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Pick the release to build
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24.22.1
          cache: true
      - name: Generate Prisma client
        run: vp run db:generate
      - name: Build the demo
        env:
          STAAASH_DEMO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: pnpm --filter web demo:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist/demo
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
