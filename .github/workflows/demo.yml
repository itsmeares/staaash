name: Demo

# Publishes the browser-only demo to GitHub Pages: the newest stable release at
# demo.staaash.org, and a newer release candidate, if there is one, at /rc/.
# Every release runs it, and a manual run rebuilds both from the releases.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  pick:
    name: Pick the releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      builds: ${{ steps.pick.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/config/package.json
            packages/config/src/version.ts
            scripts/ci
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/demo-pages.mjs pick

  build:
    name: Build the ${{ matrix.name }} demo
    needs: pick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24.22.1
          cache: true
      - name: Generate Prisma client
        run: vp run db:generate
      - name: Build the demo
        # Set here, not left to the build's default, so an older release tag
        # still builds for this address.
        env:
          STAAASH_DEMO_URL: ${{ matrix.url }}
          VITE_DEMO_RC_VERSION: ${{ matrix.candidate }}
          VITE_DEMO_STABLE_VERSION: ${{ matrix.stable }}
        run: pnpm --filter web demo:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: demo-${{ matrix.name }}
          path: apps/web/dist/demo
          retention-days: 1

  deploy:
    name: Publish the demo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/config/package.json
            packages/config/src/version.ts
            scripts/ci
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: demo-*
          path: builds
      - name: Put the demos together
        run: |
          candidate=""
          if [ -d builds/demo-candidate ]; then candidate=builds/demo-candidate; fi
          node scripts/ci/demo-pages.mjs assemble site builds/demo-stable $candidate
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
