name: PR labels

# pull_request_target runs with a write token, so it checks out main and only
# reads the PR title and author from the event.
on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Title and label
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            packages/config/package.json
            packages/config/src/change-kind.ts
            scripts/github
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2

      - name: Label the PR from its title
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github/label-pull-request.mjs
