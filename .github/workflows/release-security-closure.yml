name: Release security closure

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read
  security-events: read
  issues: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_MAIN_SHA: aee732cdef29737f344f5f75e537c66c17c42794
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install pinned pnpm
        run: corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact main push CI succeeded
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100")"

          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .workflow_runs
            | any(.head_sha == $sha and .status == "completed" and .conclusion == "success")
          ' <<<"$response" >/dev/null

      - name: Require clean pnpm audit
        run: pnpm audit --audit-level=low

      - name: Check open Dependabot alerts
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependabot/alerts?state=open&per_page=100")"
          jq -e 'length == 0' <<<"$response" >/dev/null

      - name: Require zero open main code-scanning alerts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/main&per_page=100")"
          jq -e 'length == 0' <<<"$response" >/dev/null
