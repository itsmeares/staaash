name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: New release version to prepare and publish
        required: false
        type: string
      tag:
        description: Existing release tag to verify or resume
        required: false
        type: string
      release_id:
        description: Exact existing release ID to resume
        required: false
        type: string

concurrency:
  group: staaash-release
  queue: max

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
      release_branch: ${{ steps.version.outputs.release_branch }}

    steps:
      - name: Create repository token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Check out dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify dispatch base
        env:
          EXPECTED_BASE_SHA: ${{ github.sha }}
        run: |
          ACTUAL_BASE_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_BASE_SHA" != "$EXPECTED_BASE_SHA" ]]; then
            echo "Dispatch checkout is $ACTUAL_BASE_SHA; expected $EXPECTED_BASE_SHA." >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2

      - name: Enable Corepack
        run: corepack enable

      - name: Install pinned pnpm
        run: corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release policy
        run: pnpm --filter @staaash/config build

      - name: Prepare package versions
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/index.mjs prepare-version

      - name: Reject existing release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag $RELEASE_TAG already exists; use recovery inputs instead." >&2
            exit 1
          fi

      - name: Commit package versions
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.version.outputs.release_branch }}
          VERSION_CHANGED: ${{ steps.version.outputs.changed }}
          PACKAGE_FILES: ${{ steps.version.outputs.package_files }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          if [[ "$VERSION_CHANGED" == "true" ]]; then
            git diff --check
            read -ra FILES <<< "$PACKAGE_FILES"
            git add "${FILES[@]}"
            EXPECTED_FILES="$(printf '%s\n' "${FILES[@]}" | sort)"
            ACTUAL_FILES="$(git diff --cached --name-only | sort)"
            if [[ "$ACTUAL_FILES" != "$EXPECTED_FILES" ]]; then
              echo "Unexpected release diff:" >&2
              printf '%s\n' "$ACTUAL_FILES" >&2
              exit 1
            fi
            # GitHub signs commits an App makes through the API, so the release
            # commit shows as Verified. A local commit pushed with git would not.
            ADDITIONS="$(
              for FILE in "${FILES[@]}"; do
                jq -n --arg path "$FILE" --arg contents "$(base64 -w0 "$FILE")" '{$path, $contents}'
              done | jq -s .
            )"
            RELEASE_SHA="$(
              jq -n \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg branch "$RELEASE_BRANCH" \
                --arg head "$RELEASE_SHA" \
                --arg headline "chore(release): prepare $RELEASE_TAG" \
                --argjson additions "$ADDITIONS" \
                '{
                  query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                  variables: { input: {
                    branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                    expectedHeadOid: $head,
                    message: { headline: $headline },
                    fileChanges: { additions: $additions }
                  } }
                }' |
                gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid'
            )"
            if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "GitHub returned no release commit: $RELEASE_SHA" >&2
              exit 1
            fi
            git fetch --quiet origin "$RELEASE_SHA"
            if [[ "$(git rev-parse "$RELEASE_SHA^{tree}")" != "$(git write-tree)" ]]; then
              echo "Release commit $RELEASE_SHA does not match the prepared versions." >&2
              exit 1
            fi
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Confirm release branch head
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
          RELEASE_BRANCH: ${{ steps.version.outputs.release_branch }}
        run: |
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)"
          if [[ "$REMOTE_SHA" != "$RELEASE_SHA" ]]; then
            echo "origin/$RELEASE_BRANCH is $REMOTE_SHA; expected $RELEASE_SHA." >&2
            exit 1
          fi

      - name: Create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$RELEASE_SHA"

  preflight:
    if: ${{ always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.preflight.outputs.tag }}
      version: ${{ steps.preflight.outputs.version }}
      prerelease: ${{ steps.preflight.outputs.prerelease }}
      release_sha: ${{ steps.preflight.outputs.release_sha }}
      tag_object: ${{ steps.preflight.outputs.tag_object }}
      tag_type: ${{ steps.preflight.outputs.tag_type }}
      image_repository: ${{ steps.preflight.outputs.image_repository }}
      tooling_sha: ${{ steps.preflight.outputs.tooling_sha }}
      release_branch: ${{ steps.preflight.outputs.release_branch }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag || inputs.tag || github.ref_name }}
      RELEASE_BRANCH: ${{ needs.prepare.outputs.release_branch || (github.event_name == 'workflow_dispatch' && github.ref_name) || '' }}
      EXPECTED_RELEASE_SHA: ${{ needs.prepare.outputs.release_sha || (github.event_name == 'push' && github.sha) || '' }}
      EXPECTED_TAG_OBJECT: ${{ github.event_name == 'push' && github.event.after || '' }}
      EXPECTED_TOOLING_SHA: ${{ (github.event_name == 'workflow_dispatch' && inputs.version == '') && github.sha || '' }}
      RELEASE_EVENT_NAME: ${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') && 'push' || github.event_name }}
      RECOVERY_REF: ${{ github.ref }}
      TOOLING_ROOT: ${{ github.workspace }}/tooling
      RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
      CI_WAIT_SECONDS: "1800"
      CI_POLL_SECONDS: "15"

    steps:
      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RECOVERY_TAG_INPUT: ${{ inputs.tag }}
          RECOVERY_RELEASE_ID_INPUT: ${{ inputs.release_id }}
        shell: bash
        run: |
          if [[ -n "$RELEASE_VERSION_INPUT" ]]; then
            if [[ -n "$RECOVERY_TAG_INPUT" || -n "$RECOVERY_RELEASE_ID_INPUT" ]]; then
              echo "Use version alone for a new release, or tag and release_id for recovery." >&2
              exit 1
            fi
          elif [[ -z "$RECOVERY_TAG_INPUT" || -z "$RECOVERY_RELEASE_ID_INPUT" ]]; then
            echo "Recovery requires both tag and release_id." >&2
            exit 1
          fi

      - name: Require exact recovery release ID
        if: github.event_name == 'workflow_dispatch' && inputs.version == ''
        shell: bash
        env:
          RECOVERY_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          if [[ ! "$RECOVERY_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Recovery release ID must be a canonical positive integer." >&2
            exit 1
          fi

      - name: Check out exact release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: tooling
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.version == '') && github.sha || env.RELEASE_TAG }}

      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: release-source
          ref: ${{ env.RELEASE_TAG }}

      - name: Capture exact tooling commit
        id: tooling
        shell: bash
        run: |
          SHA="$(git -C "$TOOLING_ROOT" rev-parse HEAD)"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid tooling commit: $SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2

      - name: Enable Corepack
        run: corepack enable

      - name: Install pinned pnpm
        working-directory: tooling
        run: corepack install

      - name: Install tooling dependencies
        working-directory: tooling
        run: pnpm install --frozen-lockfile

      - name: Build release policy
        working-directory: tooling
        run: pnpm --filter @staaash/config build

      - name: Verify tag, packages, tooling, and exact CI
        id: preflight
        env:
          TOOLING_SHA: ${{ steps.tooling.outputs.sha }}
        run: node tooling/scripts/release/index.mjs preflight

  publish:
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      TAG_OBJECT_SHA: ${{ needs.preflight.outputs.tag_object }}
      TAG_TYPE: ${{ needs.preflight.outputs.tag_type }}
      IMAGE_REPOSITORY: ${{ needs.preflight.outputs.image_repository }}
      TOOLING_SHA: ${{ needs.preflight.outputs.tooling_sha }}
      RELEASE_BRANCH: ${{ needs.preflight.outputs.release_branch }}
      RELEASE_EVENT_NAME: ${{ (github.event_name == 'workflow_dispatch' && inputs.version != '') && 'push' || github.event_name }}
      RECOVERY_RELEASE_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.version == '') && inputs.release_id || '' }}
      TOOLING_ROOT: ${{ github.workspace }}/tooling
      RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
      ASSET_DIR: ${{ github.workspace }}/release-assets

    steps:
      - name: Check out verified release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: tooling
          ref: ${{ needs.preflight.outputs.tooling_sha }}

      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: release-source
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify exact tooling checkout
        shell: bash
        run: |
          ACTUAL="$(git -C "$TOOLING_ROOT" rev-parse HEAD)"
          if [[ "$ACTUAL" != "$TOOLING_SHA" ]]; then
            echo "Tooling checkout is $ACTUAL; expected $TOOLING_SHA." >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2

      - name: Enable Corepack
        run: corepack enable

      - name: Install pinned pnpm
        working-directory: tooling
        run: corepack install

      - name: Install tooling dependencies
        working-directory: tooling
        run: pnpm install --frozen-lockfile

      - name: Build release policy
        working-directory: tooling
        run: pnpm --filter @staaash/config build

      - name: Recheck immutable tooling and tag identity
        run: node tooling/scripts/release/index.mjs verify-tag

      # The release author is whoever creates it, so the release App creates it.
      - name: Create repository token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create or resolve release
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node tooling/scripts/release/index.mjs ensure-release

      - name: Capture exact release ID
        shell: bash
        env:
          RESOLVED_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          if [[ ! "$RESOLVED_RELEASE_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid release ID: $RESOLVED_RELEASE_ID" >&2
            exit 1
          fi
          echo "RELEASE_ID=$RESOLVED_RELEASE_ID" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect existing versioned image
        id: image
        run: node tooling/scripts/release/index.mjs inspect-image

      - name: Build and push exact versioned image
        id: build
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ env.RELEASE_SOURCE_ROOT }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.title=staaash
            org.opencontainers.image.description=A self-hosted file drive with desktop sync, sharing, and a modern web interface.
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select immutable image digest
        id: digest
        shell: bash
        env:
          EXISTING_DIGEST: ${{ steps.image.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          DIGEST="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Missing or invalid OCI index digest: $DIGEST" >&2
            exit 1
          fi
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify exact image digest and runtime versions
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: node tooling/scripts/release/index.mjs verify-image

      - name: Generate release-specific installation assets
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: node tooling/scripts/release/index.mjs generate-assets

      - name: Reconcile draft notes and assets
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: node tooling/scripts/release/index.mjs reconcile-release

      - name: Publish verified GitHub Release
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: node tooling/scripts/release/index.mjs publish

      - name: Promote stable digest to latest
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.value }}
        run: node tooling/scripts/release/index.mjs promote-latest

      - name: Clean runner release assets
        if: always()
        shell: bash
        run: rm -rf "$ASSET_DIR"

      - name: Write retry and investigation summary
        if: always()
        continue-on-error: true
        env:
          RELEASE_RESULT: ${{ job.status }}
        run: node tooling/scripts/release/index.mjs summary

  # The desktop app ships as installers on the same release. They are built
  # after the server release is published, so a failed installer build never
  # holds back the server; rerunning this job retries only the installers.
  desktop:
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs: [preflight, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.preflight.outputs.tag }}
      release_tag: ${{ needs.preflight.outputs.tag }}

  # The Windows server installer follows the same rule as the desktop ones.
  windows-server:
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs: [preflight, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/windows-server.yml
    with:
      ref: ${{ needs.preflight.outputs.tag }}
      release_tag: ${{ needs.preflight.outputs.tag }}

  # The browser demo follows the published release, like the installers.
  demo:
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    needs: [preflight, publish]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/demo.yml
    with:
      ref: ${{ needs.preflight.outputs.tag }}
