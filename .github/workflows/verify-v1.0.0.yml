name: Snapshot v1.0.0 release state

on:
  push:
    branches:
      - release/v1.0.0-verification
    paths:
      - ".github/workflows/verify-v1.0.0.yml"

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPORT_DIR: .release-verification
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v1.0.0-verification

      - name: Capture current state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$REPORT_DIR"
          mkdir -p "$REPORT_DIR"

          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&per_page=20" > "$REPORT_DIR/release-runs.json"
          jq '.workflow_runs | sort_by(.created_at) | last // {}' "$REPORT_DIR/release-runs.json" > "$REPORT_DIR/latest-release-run.json"

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" > "$REPORT_DIR/release.json"; then
            jq -r '.body // ""' "$REPORT_DIR/release.json" > "$REPORT_DIR/release-notes-current.md"
          else
            printf '%s\n' '{"error":"release not published"}' > "$REPORT_DIR/release.json"
            : > "$REPORT_DIR/release-notes-current.md"
          fi

          {
            echo "run_id=$(jq -r '.id // "missing"' "$REPORT_DIR/latest-release-run.json")"
            echo "run_status=$(jq -r '.status // "missing"' "$REPORT_DIR/latest-release-run.json")"
            echo "run_conclusion=$(jq -r '.conclusion // "missing"' "$REPORT_DIR/latest-release-run.json")"
            echo "run_head_sha=$(jq -r '.head_sha // "missing"' "$REPORT_DIR/latest-release-run.json")"
            echo "run_head_branch=$(jq -r '.head_branch // "missing"' "$REPORT_DIR/latest-release-run.json")"
            echo "release_id=$(jq -r '.id // "missing"' "$REPORT_DIR/release.json")"
            echo "release_draft=$(jq -r '.draft // "missing"' "$REPORT_DIR/release.json")"
            echo "release_prerelease=$(jq -r '.prerelease // "missing"' "$REPORT_DIR/release.json")"
            echo "release_assets=$(jq -r '[.assets[]?.name] | sort | join(",")' "$REPORT_DIR/release.json")"
          } > "$REPORT_DIR/snapshot.txt"

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT_DIR"
          git commit -m "chore: record temporary v1.0.0 snapshot"
          git push origin HEAD:release/v1.0.0-verification
