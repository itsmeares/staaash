name: Polish v1.0.0 release notes

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: "363560464"
    steps:
      - name: Replace human-readable notes and preserve provenance
        shell: bash
        run: |
          set -euo pipefail

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          current_body="$(jq -r '.body // ""' <<<"$release")"

          provenance="$(python - "$current_body" <<'PY'
          import sys

          body = sys.argv[1]
          start = "<!-- staaash:release-provenance:start -->"
          end = "<!-- staaash:release-provenance:end -->"
          start_index = body.find(start)
          end_index = body.find(end)
          if start_index < 0 or end_index < start_index:
              raise SystemExit("Release provenance block is missing or malformed.")
          end_index += len(end)
          print(body[start_index:end_index])
          PY
          )"

          notes="$(cat <<'EOF'
          # Staaash v1.0.0

          Staaash v1.0.0 is the first stable release of the private, self-hosted file drive for storage you control.

          ## Highlights

          - Browser-based file and folder management with uploads, previews, downloads, rename, move, favorites, search, trash, restore, and permanent deletion.
          - Resumable uploads, per-user storage quotas, generated ZIP downloads, and worker-managed media previews.
          - Public file and folder sharing with optional passwords, expiry dates, download controls, media previews, revocation, and canonical public URLs.
          - Multiple-user administration with temporary passwords, required password changes, session controls, and per-user storage limits.
          - Operator-facing health, integrity, storage, job, update, and reconciliation views.
          - Crash-recoverable storage mutations backed by a durable PostgreSQL journal, leases, fencing, atomic same-volume filesystem operations, and fail-closed ambiguity handling.

          ## Deployment requirements

          - Docker Engine or Docker Desktop with the Docker Compose plugin.
          - Linux AMD64. A native ARM64 image is not published for v1.0.0.
          - PostgreSQL 18, supplied by the release Compose stack.
          - Local, same-volume app-managed storage with atomic rename and working file and directory `fsync`. Network filesystems, object-storage mounts, and S3-compatible backends are not supported storage locations.

          Staaash is a file drive, not a backup system. Keep an independent backup of important data and test restores regularly.

          ## Installation

          Download `docker-compose.yml` and `example.env` from the assets attached to this release, rename `example.env` to `.env`, set a secure `DB_PASSWORD`, then start the stack with:

          ```console
          docker compose up -d
          ```

          Open `http://localhost:2113` and complete initial setup. The first account becomes the owner.

          ## Upgrade notes

          Compatible PostgreSQL 18 RC/v1 installations can upgrade in place after taking a complete offline backup. Alpha and beta deployments are unsupported development history and require a fresh installation; do not reuse their internal database or storage directories as current data directories.

          ## Release hardening

          This stable release includes the final storage-mutation recovery work, release-workflow integrity and recovery hardening, security dependency fixes, and the complete pre-release production revalidation and backup/restore drill.

          **Full Changelog:** https://github.com/itsmeares/staaash/compare/v1.0.0-rc.7...v1.0.0
          EOF
          )"

          new_body="${notes}

          ${provenance}"
          jq -n --arg body "$new_body" '{body:$body}' \
            | gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --method PATCH --input - \
            > updated-release.json

          updated_body="$(jq -r '.body // ""' updated-release.json)"
          [[ "$(jq -r '.draft' updated-release.json)" == "false" ]]
          [[ "$(jq -r '.prerelease' updated-release.json)" == "false" ]]
          [[ "$(jq -r '.tag_name' updated-release.json)" == "v1.0.0" ]]
          [[ "$updated_body" == *"# Staaash v1.0.0"* ]]
          [[ "$updated_body" == *"<!-- staaash:release-provenance:start -->"* ]]
          [[ "$updated_body" == *"<!-- staaash:release-provenance:end -->"* ]]
          [[ "$(grep -Fc '<!-- staaash:release-provenance:start -->' <<<"$updated_body")" == "1" ]]
          [[ "$(grep -Fc '<!-- staaash:release-provenance:end -->' <<<"$updated_body")" == "1" ]]

          printf '%s\n' "$updated_body"
