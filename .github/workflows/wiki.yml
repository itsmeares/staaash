name: Wiki

# The guides moved to staaash.org/docs. Released versions still link to wiki
# pages, so each one is replaced by a note that points to its new address.
# Run it once by hand; the wiki goes away once old versions are rare.
on:
  workflow_dispatch:

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Point the wiki to staaash.org
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Replace every page with a moved note
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          cd "$RUNNER_TEMP/wiki"
          rm -f _Sidebar.md _Footer.md
          for page in *.md; do
            name="${page%.md}"
            slug="$(echo "$name" | tr '[:upper:]' '[:lower:]')/"
            [ "$name" = Home ] && slug=""
            url="https://staaash.org/docs/$slug"
            printf 'This page moved to [%s](%s).\n' "$url" "$url" > "$page"
          done
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already points to staaash.org."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Point the guides to staaash.org/docs"
          git push
