# Adds Caddy in front of Staaash with automatic HTTPS. Turn it on in .env.
services:
  caddy:
    container_name: staaash_caddy
    image: caddy:2-alpine
    # Staaash accepts a trailing slash, but Caddy would read it as a path.
    entrypoint:
      - sh
      - -c
      - export STAAASH_PUBLIC_URL="$${STAAASH_PUBLIC_URL%/}"; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      STAAASH_PUBLIC_URL: ${STAAASH_PUBLIC_URL:?Set STAAASH_PUBLIC_URL in .env, for example https://drive.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      staaash:
        condition: service_healthy
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
