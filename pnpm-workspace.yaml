packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@hono/node-server": 2.1.5
  brace-expansion: 5.0.12
  deepmerge-ts: 8.0.2
  esbuild@>=0.17.0 <0.28.1: ^0.28.2
  esbuild@>=0.27.3 <0.28.1: ^0.28.2
  fast-uri: 4.2.2
  find-my-way: 9.10.0
  hono: 4.13.13
  ip-address: 10.7.4
  mysql2: 3.24.6
  postcss: 8.5.31
  sharp: 0.35.5
  valibot: 1.5.0
  vite@*: "catalog:"
  vitest@*: "catalog:"
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  msw: true
  prisma: true
  sharp: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@tanstack/react-virtual@3.14.22"
  - "@tanstack/virtual-core@3.19.7"
