packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@hono/node-server": 2.1.5
  brace-expansion: 5.0.12
  # Older minimatch calls the 1.x and 2.x API; these releases carry every fix.
  minimatch@3>brace-expansion: 1.1.21
  minimatch@5>brace-expansion: 2.1.7
  minimatch@9>brace-expansion: 2.1.7
  deepmerge-ts: 8.0.2
  esbuild@>=0.17.0 <0.28.1: ^0.28.2
  esbuild@>=0.27.3 <0.28.1: ^0.28.2
  fast-uri: 4.2.3
  find-my-way: 9.10.0
  hono: 4.13.14
  ip-address: 10.7.5
  mysql2: 3.24.6
  postcss: 8.5.32
  valibot: 1.5.0
  # Same version as vite-plus in the catalog below.
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: "catalog:"
allowBuilds:
  "@prisma/engines": true
  "@parcel/watcher": false
  electron: true
  electron-winstaller: false
  esbuild: true
  msw: true
  prisma: true
catalog:
  vitest: 5.0.5
  vite-plus: 1.4.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
