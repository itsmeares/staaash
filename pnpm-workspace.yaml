packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@hono/node-server": 2.1.11
  brace-expansion: 5.0.13
  # Older minimatch calls the 1.x and 2.x API; these releases carry every fix.
  minimatch@3>brace-expansion: 1.1.22
  minimatch@5>brace-expansion: 2.1.8
  # GHSA-g3hv-75wg-m249 is only fixed in 11. The build tools that pull these in
  # use only minimatch(), Minimatch and match(), which 11 keeps.
  minimatch@>=7.0.0 <11.0.1: 11.0.9
  deepmerge-ts: 8.0.2
  esbuild@>=0.17.0 <0.28.1: ^0.28.2
  esbuild@>=0.27.3 <0.28.1: ^0.28.2
  fast-uri: 4.2.3
  find-my-way: 9.10.2
  hono: 4.13.19
  ip-address: 10.7.6
  mysql2: 3.24.6
  postcss: 8.5.33
  valibot: 1.5.0
  # Same vite-plus-core version that the vite-plus catalog version depends on.
  vite@*: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest@*: "catalog:"
allowBuilds:
  "@prisma/engines": true
  "@parcel/watcher": false
  electron: true
  electron-winstaller: false
  esbuild: true
  msw: true
  prisma: true
  workerd: true
catalog:
  vitest: 5.1.1
  vite-plus: 1.7.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20261117.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261117.1"
  - "@cloudflare/workerd-linux-64@1.20261117.1"
  - "@cloudflare/workerd-linux-arm64@1.20261117.1"
  - "@cloudflare/workerd-windows-64@1.20261117.1"
  - miniflare@5.20261117.0-beta
  - workerd@1.20261117.1
  - wrangler@4.164.0
